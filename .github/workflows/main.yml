name: Build Custom ChromeOS

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Explicitly forces write access for the GITHUB_TOKEN
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Image Lowercase
        run: |
          # Convert username and repo to lowercase to satisfy Docker registry standards
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          
          docker build -t ghcr.io/$IMAGE_OWNER/$REPO_NAME/chromeos:latest .
          docker push ghcr.io/$IMAGE_OWNER/$REPO_NAME/chromeos:latest
